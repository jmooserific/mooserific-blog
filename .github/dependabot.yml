version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Batch routine bumps into one PR; majors still get their own PR.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7 dropped the classic `lib/typescript.js` API (native/Go
      # compiler now, CLI-only package). Next.js's default type-check can't
      # find it and the build fails. Revisit once Next officially supports
      # the new package (or we opt into experimental.useTypeScriptCli).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
